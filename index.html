<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Georgia, serif;
    overflow:hidden;
}

.container{
    width:100vw;
    height:100vh;
    max-width:480px;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:#fff7f5;
}

/* ---------- PAGE 1 ---------- */

.page{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:1s ease;
}

#page1{
    background:radial-gradient(circle,#ffd8df,#fff8f6 65%);
}

.smallText{
    color:#777;
    font-size:13px;
    letter-spacing:1px;
    margin-bottom:20px;
}

.heart{
    width:90px;
    height:90px;
    background:#ff4d78;
    position:relative;
    transform:rotate(-45deg);
    animation:heartbeat 1.2s infinite;
    box-shadow:0 0 40px #ff7b9b;
}

.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    background:#ff4d78;
    border-radius:50%;
}

.heart:before{
    top:-45px;
    left:0;
}

.heart:after{
    left:45px;
    top:0;
}

@keyframes heartbeat{
    0%,100%{transform:rotate(-45deg) scale(1)}
    50%{transform:rotate(-45deg) scale(1.15)}
}

.tap{
    margin-top:55px;
    color:#999;
    font-size:12px;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    50%{opacity:.3}
}

/* ---------- PAGE 2 ---------- */

#page2{
    background:linear-gradient(135deg,#fff5f6,#ffdbe4);
    opacity:0;
    pointer-events:none;
}

.title{
    font-size:45px;
    color:#e91e63;
    text-align:center;
    animation:pop 1.5s ease;
}

.name{
    font-size:31px;
    color:#333;
    margin-top:18px;
    letter-spacing:2px;
}

.date{
    margin-top:12px;
    color:#777;
    font-size:16px;
}

@keyframes pop{
    0%{transform:scale(0);opacity:0}
    70%{transform:scale(1.1)}
    100%{transform:scale(1);opacity:1}
}

/* ---------- PAGE 3 ---------- */

#page3{
    background:#fff8f3;
    opacity:0;
    pointer-events:none;
}

.tree{
    width:3px;
    height:230px;
    background:#5b4636;
    position:absolute;
    bottom:110px;
}

.branch{
    position:absolute;
    height:2px;
    background:#5b4636;
    transform-origin:left;
}

.b1{width:100px;transform:rotate(-38deg);top:55px;left:0}
.b2{width:80px;transform:rotate(35deg);top:90px;left:0}
.b3{width:75px;transform:rotate(-50deg);top:125px;left:0}
.b4{width:65px;transform:rotate(45deg);top:150px;left:0}

.msg{
    position:absolute;
    bottom:55px;
    text-align:center;
    color:#d95b7b;
    font-size:18px;
    padding:0 30px;
}

/* ---------- PAGE 4 PHOTOS ---------- */

#page4{
    background:linear-gradient(#fff1f4,#ffd8e3);
    opacity:0;
    pointer-events:none;
    padding:20px;
}

.photoTitle{
    color:#d81b60;
    font-size:28px;
    margin-bottom:20px;
}

.gallery{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.photoBox{
    height:190px;
    border:4px solid white;
    border-radius:15px;
    overflow:hidden;
    background:#f3cbd5;
    box-shadow:0 5px 15px #0002;
}

.photoBox img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.uploads{
    margin-top:15px;
    display:flex;
    gap:5px;
}

.uploads input{
    width:24%;
    font-size:8px;
}

.finalText{
    margin-top:15px;
    text-align:center;
    color:#555;
    font-size:15px;
}

/* ---------- BUTTON ---------- */

.nextBtn{
    position:absolute;
    bottom:18px;
    right:18px;
    z-index:20;
    border:0;
    background:#e91e63;
    color:white;
    padding:10px 18px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 5px 15px #e91e6366;
}

/* ---------- FLOATING HEARTS ---------- */

.floating{
    position:absolute;
    bottom:-30px;
    color:#ff668c;
    animation:floatUp 5s linear forwards;
    pointer-events:none;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0);
        opacity:1;
    }
    100%{
        transform:translateY(-900px) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- PAGE 1 -->
    <section class="page" id="page1">
        <div class="smallText">Someone special has a birthday...</div>

        <div class="many heart"></div>

        <div class="tap">Tap NEXT ❤️</div>
    </section>


    <!-- PAGE 2 -->
    <section class="page" id="page2">
        <div class="title">Happy Birthday</div>
        <div class="name">MD AZIZ ❤️</div>
        <div class="date">11 AUGUST 2007 🎂</div>
    </section>


    <!-- PAGE 3 -->
    <section class="page" id="page3">

        <div class="smallText">
            A special day for a very special friend
        </div>

        <div class="tree">
            <div class="branch b1"></div>
            <div class="branch b2"></div>
            <div class="branch b3"></div>
            <div class="branch b4"></div>
        </div>

        <div class="msg">
            May your life always be filled with<br>
            happiness, success & beautiful memories ❤️
        </div>

    </section>


    <!-- PAGE 4 -->
    <section class="page" id="page4">

        <div class="photoTitle">
            Beautiful Memories 📸
        </div>

        <div class="gallery">

            <div class="photoBox">
                <img id="Photo1"
                     src="PHOTO1.jpg">
            </div>

            <div class="photoBox">
                <img id="photo2"
                     src="photo2.jpg">
            </div>

            <div class="photoBox">
                <img id="photo3"
                     src="photo3.jpg"
            </div>

            <div class="photoBox">
                <img id="photo4"
                     src="photo4.jpg"
            </div>

        </div>

        <!-- 4 PHOTO UPLOADS -->
        <div class="uploads">
            <input type="file" accept="image/*" onchange="loadPhoto(event,1)">
            <input type="file" accept="image/*" onchange="loadPhoto(event,2)">
            <input type="file" accept="image/*" onchange="loadPhoto(event,3)">
            <input type="file" accept="image/*" onchange="loadPhoto(event,4)">
        </div>

        <div class="finalText">
            Happy Birthday once again, MD AZIZ! 🎂❤️
        </div>

    </section>


    <button class="nextBtn" onclick="nextPage()">NEXT →</button>

</div>


<script>

let currentPage = 1;

function nextPage(){

    if(currentPage >= 4){
        currentPage = 1;
    }else{
        currentPage++;
    }

    for(let i=1;i<=4;i++){

        let page = document.getElementById("page"+i);

        if(i === currentPage){
            page.style.opacity = "1";
            page.style.pointerEvents = "auto";
        }else{
            page.style.opacity = "0";
            page.style.pointerEvents = "none";
        }
    }

    createHearts();
}


/* PHOTO UPLOAD */

function loadPhoto(event,number){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        document.getElementById("photo"+number).src =
            e.target.result;

    };

    reader.readAsDataURL(file);
}


/* FLOATING HEARTS */

function createHearts(){

    for(let i=0;i<12;i++){

        const heart = document.createElement("div");

        heart.className = "floating";

        heart.innerHTML = "♥";

        heart.style.left =
            Math.random()*100 + "%";

        heart.style.animationDuration =
            (3 + Math.random()*3) + "s";

        heart.style.fontSize =
            (12 + Math.random()*20) + "px";

        document.querySelector(".container")
            .appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },6000);
    }
}

</script>

</body>
</html>
